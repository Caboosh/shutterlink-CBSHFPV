name: Create Pre-Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        
      - name: Build and Upload Artifact for the Release
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio
    
      - name: Build PlatformIO Project
        run: pio run
    
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware.bin
          path: .pio/build/esp32c3/
          
  create_release:
    runs-on: ubuntu-latest
    steps:
      - name: Create Pre-Release
        uses: nekofar/create-github-release@v1.0.15
        with:
          tag: ${{ github.ref_name }}
          files: |
            .pio/build/esp32c3/firmware.bin
          title: Pre-Release ${{ github.ref_name }}
          prerelease: true
          token: ${{ secrets.GITHUB_TOKEN }}
  
